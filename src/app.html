<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/icons/icon.svg" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#071a2b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kids 6–10" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon.svg" />
    <style>
      #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(ellipse at 50% 18%, #123350 0%, #071a2b 55%, #04101f 100%);
        color: #e9f7ff;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }
      #boot-screen[hidden] {
        display: none;
      }
      .boot-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        max-width: 260px;
        text-align: center;
      }
      .boot-icon {
        width: 46px;
        height: 46px;
        color: #7dd3fc;
        filter: drop-shadow(0 0 18px rgba(125, 211, 252, 0.6));
      }
      .boot-icon svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .boot-spinner {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 3px solid rgba(125, 211, 252, 0.2);
        border-top-color: #7dd3fc;
        animation: boot-spin 1s linear infinite;
      }
      #boot-screen.failed .boot-spinner {
        display: none;
      }
      #boot-note {
        margin: 0;
        font-size: 14px;
        line-height: 1.4;
      }
      #boot-repair {
        min-height: 44px;
        padding: 10px 18px;
        border: 1px solid rgba(125, 211, 252, 0.6);
        border-radius: 999px;
        background: #7dd3fc;
        color: #04101f;
        font: inherit;
        font-size: 14px;
        font-weight: 750;
        cursor: pointer;
      }
      #boot-repair[hidden] {
        display: none;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner {
          animation: none;
        }
      }
    </style>
    <script>
      (() => {
        const RECOVERY_KEY = 'frost-recovery-pending';
        const STALE_BUILD_ERROR =
          /valid JavaScript MIME type|MIME type of ['"]?text\/html|disallowed MIME type|Failed to fetch dynamically imported module|Importing a module script failed|error loading dynamically imported module|ChunkLoadError/i;

        async function repair() {
          try {
            if ('serviceWorker' in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.all(registrations.map((registration) => registration.unregister()));
            }
            if ('caches' in window) {
              const keys = await caches.keys();
              await Promise.all(keys.map((key) => caches.delete(key)));
            }
          } catch {
            // Reload even if the browser blocks cleanup.
          }
          location.reload();
        }

        window.__frostRepair = repair;

        window.addEventListener('unhandledrejection', (event) => {
          const reason = event.reason;
          const message = reason && (reason.message || String(reason));
          if (typeof message !== 'string' || !STALE_BUILD_ERROR.test(message)) return;
          if (!navigator.onLine) return;

          try {
            // Recover once per loaded document. If the reload fails again,
            // leave the manual repair button to the user instead of looping.
            if (sessionStorage.getItem(RECOVERY_KEY)) return;
            sessionStorage.setItem(RECOVERY_KEY, '1');
          } catch {
            return;
          }

          event.preventDefault();
          repair();
        });
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="boot-screen" role="status" aria-live="polite">
      <div class="boot-card">
        <span class="boot-icon" aria-hidden="true">
          <svg
            viewBox="0 0 48 48"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
          >
            <path d="M24 4v40M6.7 14l34.6 20M41.3 14L6.7 34" />
            <path d="M24 4l-4.5 4.5M24 4l4.5 4.5M24 44l-4.5-4.5M24 44l4.5-4.5" />
            <path d="M6.7 14l6.2-.8M6.7 14l2.6 5.7M41.3 34l-6.2.8M41.3 34l-2.6-5.7" />
            <path d="M41.3 14l-6.2-.8M41.3 14l-2.6 5.7M6.7 34l6.2.8M6.7 34l2.6-5.7" />
          </svg>
        </span>
        <span class="boot-spinner" aria-hidden="true"></span>
        <p id="boot-note">Loading…</p>
        <button id="boot-repair" type="button" hidden>Repair &amp; reload</button>
      </div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
    <script>
      (() => {
        const screen = document.getElementById('boot-screen');
        const note = document.getElementById('boot-note');
        const repairButton = document.getElementById('boot-repair');
        const timer = window.setTimeout(() => {
          screen.classList.add('failed');
          note.textContent = 'Still loading? Repair the app.';
          repairButton.hidden = false;
        }, 8000);

        window.__frostBooted = () => {
          window.clearTimeout(timer);
          try {
            sessionStorage.removeItem('frost-recovery-pending');
          } catch {
            // Storage can be unavailable; boot still succeeds.
          }
          if (screen) screen.hidden = true;
        };

        repairButton.addEventListener('click', () => {
          repairButton.disabled = true;
          repairButton.textContent = 'Repairing…';
          try {
            sessionStorage.removeItem('frost-recovery-pending');
          } catch {
            // Storage can be unavailable; repair still succeeds.
          }
          window.__frostRepair?.();
        });
      })();
    </script>
  </body>
</html>
